<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitclip — social preview 1280×640 (GitHub, Open Graph)</title>
<link rel="stylesheet" href="../fitclip.css">
<style>
html,body{width:1280px;height:640px}
.s{position:relative;width:1280px;height:640px;overflow:hidden;background:var(--bg)}
.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
.brand .mark{width:32px;height:32px;border-radius:9px}
.h{position:absolute;left:64px;top:132px;width:520px;font-size:50px;font-weight:700;letter-spacing:-.03em;line-height:1.02}
.h span{color:var(--acc)}
.was{position:absolute;left:64px;top:300px;font-size:30px;font-weight:600;color:var(--text-3);text-decoration:line-through;text-decoration-thickness:2px}
.now{position:absolute;left:60px;top:336px;font-size:120px;font-weight:700;letter-spacing:-.05em;line-height:.9}
.now small{font-size:36px;letter-spacing:-.02em;margin-left:6px;color:var(--text-2)}
.meter{position:absolute;left:64px;top:470px;width:470px}
.foot{position:absolute;left:64px;bottom:52px;color:var(--text-2);font-size:18px}
.foot b{color:var(--text);font-weight:600}
.shot{position:absolute;left:610px;top:96px;width:800px;border-radius:18px;border:1px solid var(--line);overflow:hidden}
.shot img{width:100%;display:block}
</style>
</head>
<body>
<div class="s">
  <div class="brand"><div class="mark"><svg width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="#02201b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2H2v2M8 2h2v2M4 10H2V8M8 10h2V8"/></svg></div>Fitclip</div>
  <div class="h">Free Discord video <span>compressor</span></div>
  <div class="was">57.2 MB Twitch clip</div>
  <div class="now num">19.2<small>MB</small></div>
  <div class="meter">
    <div class="mbar" style="height:12px;border-radius:999px;background:var(--raise);position:relative"><i style="position:absolute;left:0;top:0;bottom:0;width:87.3%;border-radius:999px;background:var(--acc)"></i><b style="position:absolute;left:90.9%;top:-6px;bottom:-6px;width:2px;background:var(--text)"></b></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--text-2)"><span class="pill ok" style="height:26px">Fits Discord Free</span><span><b style="color:var(--text)">20 MB</b> limit</span></div>
  </div>
  <div class="foot">Trim, compress, paste. <b>Offline, no watermark.</b></div>
  <div class="shot"><img src="../../assets/screenshots/discord-video-compressor.png" alt=""></div>
</div>
</body>
</html>
